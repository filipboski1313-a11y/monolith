# ╔══════════════════════════════════════════════════════════════════╗
# ║                  MONOLITH HYPRLAND CONFIGURATION                 ║
# ║  Ultra-Minimalist • Razor-Sharp • Zero-Bloat • High Performance  ║
# ╚══════════════════════════════════════════════════════════════════╝

# --- Monitors ---
monitor = , preferred, auto, 1

# --- Environment ---
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Monolith
env = DESKTOP_SESSION,Monolith
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_SCALE_FACTOR_ROUNDING_POLICY,PassThrough
env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = NIXOS_OZONE_WL,1
env = MOZ_ENABLE_WAYLAND,1
env = MESA_SHADER_CACHE_MAX_SIZE,4G
env = LD_LIBRARY_PATH,/usr/libexec/hyprland/vendor/lib64
# --- Hardware & GPU Configuration (Auto-detected per machine) ---
source = ~/.config/monolith/hardware.conf
env = XCURSOR_THEME,WhiteSur-cursors
env = XCURSOR_SIZE,24

# --- Cursor Navigation ---
cursor {
    no_warps = true
}

# --- XWayland Configuration (Eliminates blurry/pixelated scaling) ---
xwayland {
    force_zero_scaling = true
}

# --- Autostart Daemons ---
exec-once = ~/.config/monolith/scripts/session-init.sh
exec-once = foot --server -c ~/.config/monolith/foot/foot.ini
exec-once = thunar --daemon
exec-once = systemctl --user start monolith-waybar
exec-once = systemctl --user start monolith-toolbox.service
exec-once = systemctl --user start monolith-popup.service
exec-once = systemctl --user start monolith-taskgraph.service
exec-once = systemctl --user start monolith-ram-preload.service
exec-once = swaync -c ~/.config/monolith/swaync/config.json -s ~/.config/monolith/swaync/style.css
exec-once = hyprpaper -c ~/.config/monolith/hyprpaper.conf
exec-once = hypridle -c ~/.config/monolith/hypridle.conf
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# --- Input Configuration ---
input {
    kb_layout = pl # Default layout (change to 'us' or your locale: us, pl, de, fr, etc.)
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        scroll_factor = 1.0
    }
}

binds {
    scroll_event_delay = 0
}

# --- General Layout & Aesthetics ---
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 1

    # Crisp architectural silver & pure black gradient
    col.active_border = rgba(ffffffdd) rgba(333333aa) 45deg
    col.inactive_border = rgba(141414ff)

    layout = dwindle
    resize_on_border = true
    hover_icon_on_border = true
    no_focus_fallback = false
}

# --- Decoration ---
decoration {
    rounding = 4
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0

    # Zero GPU overhead: shadows and blurs disabled for extreme performance
    shadow {
        enabled = false
    }

    blur {
        enabled = false
    }
}

# --- Animations (Micro-Transitions: Smooth & Instant, No Pop-in Jank) ---
animations {
    enabled = true

    # Snappy, linear-like micro-curve: zero sluggish spring bounce
    bezier = instant, 0.16, 1, 0.3, 1
    bezier = micro, 0.05, 0.9, 0.1, 1.0

    # Super-fast 120-140ms durations (measured in tenths of a second)
    animation = windows, 1, 1.4, micro, popin 90%
    animation = windowsOut, 1, 1.2, micro, popin 90%
    animation = windowsMove, 1, 1.4, micro
    animation = border, 1, 1.5, instant
    animation = fade, 1, 1.2, instant
    animation = workspaces, 1, 1.4, micro, slide
    animation = specialWorkspace, 1, 1.2, micro, popin 90%
}

# --- Dwindle Layout ---
dwindle {
    preserve_split = true
    force_split = 2
    smart_resizing = true
    smart_split = false
}

# --- Performance & Engine Optimization ---
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    mouse_move_enables_dpms = true
    mouse_move_focuses_monitor = true
    key_press_enables_dpms = true
    animate_manual_resizes = false
    enable_swallow = true
    swallow_regex = ^(foot|kitty|Alacritty)$
    focus_on_activate = true
}

render {
    direct_scanout = 2
}

# --- Window Rules (Modern Block Syntax) ---
windowrule {
    name = float_pavucontrol
    match:class = ^(pavucontrol|pavucontrol-qt)$
    float = true
    size = 700 480
    center = true
}

windowrule {
    name = float_network
    match:class = ^(nm-connection-editor|blueman-manager)$
    float = true
}

windowrule {
    name = float_file_dialogs
    match:title = ^(Open File|Select a File|Choose Files|Save As|Confirm to replace files|File Operation Progress)$
    float = true
}

windowrule {
    name = float_portal
    match:class = ^(org.freedesktop.impl.portal.desktop.gtk)$
    float = true
}

# System Monitor Overlay
windowrule {
    name = float_btop_monitor
    match:class = ^(btop-monitor)$
    float = true
    size = 980 620
    center = true
}

# Monolith Settings Control Center (Floating by default)
windowrule {
    name = float_monolith_settings
    match:class = ^(org.monolith.control|org.monolith.settings|monolith-settings)$
    float = true
    size = 920 720
    center = true
}

# Spotify Dedicated Window Rule (Always directed to special:spotify)
windowrule {
    name = spotify_tab
    match:class = ^([Ss]potify)$
    workspace = special:spotify
}

# Picture-in-Picture
windowrule {
    name = pip_video
    match:title = ^(Picture-in-Picture|Picture in picture)$
    float = true
    pin = true
    size = 640 360
    move = 100%-650 100%-370
}

# --- Spatial Tabs & Workspaces ---
workspace = special:spotify, on-created-empty:spotify
workspace = special:extra
workspace = special:hidden
workspace = special:ramvault

# --- Touchpad Gestures (Hyprland 0.56+) ---
gestures {
    workspace_swipe_distance = 250
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 30
    workspace_swipe_cancel_ratio = 0.5
    workspace_swipe_create_new = true
}

# 3 fingers horizontal swipe = switch regular workspaces left-right
gesture = 3, horizontal, workspace

# 3 fingers vertical swipe = directional spatial tabs (1-step barrier, with or without SUPER)
gesture = 3, up, mod: SUPER, dispatcher, exec, ~/.config/monolith/scripts/spatial-tab.sh up
gesture = 3, down, mod: SUPER, dispatcher, exec, ~/.config/monolith/scripts/spatial-tab.sh down
gesture = 3, up, dispatcher, exec, ~/.config/monolith/scripts/spatial-tab.sh up
gesture = 3, down, dispatcher, exec, ~/.config/monolith/scripts/spatial-tab.sh down

# --- Keybindings ---
$mainMod = SUPER

# Applications
bind = $mainMod, Return, exec, footclient -N 2>/dev/null || foot -c ~/.config/monolith/foot/foot.ini
bind = $mainMod, Space, exec, ~/.config/monolith/scripts/app-launcher.sh
bindr = $mainMod, SUPER_L, exec, ~/.config/monolith/scripts/app-launcher.sh
bind = $mainMod, D, exec, ~/.config/monolith/scripts/app-launcher.sh
bind = $mainMod, E, exec, thunar
bind = $mainMod, B, exec, xdg-open https://google.com || zen-browser || firefox || chromium
bind = $mainMod, I, exec, monolith-settings
bind = $mainMod, comma, exec, monolith-settings

# Window Management
bind = $mainMod, Q, exec, ~/.config/monolith/scripts/smart-kill.sh
bind = $mainMod SHIFT, Q, killactive
bind = $mainMod, C, killactive
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod, P, pin
bind = $mainMod, T, layoutmsg, togglesplit

# Window Grouping / Tabs
bind = $mainMod, G, togglegroup
bind = $mainMod, Tab, changegroupactive, f
bind = $mainMod SHIFT, Tab, changegroupactive, b

# Focus Navigation (Vim & Arrows)
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Window Movement
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Workspaces (1 - 9)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move window to Workspace (SUPER + ALT + 1..9)
bind = $mainMod ALT, 1, movetoworkspace, 1
bind = $mainMod ALT, 2, movetoworkspace, 2
bind = $mainMod ALT, 3, movetoworkspace, 3
bind = $mainMod ALT, 4, movetoworkspace, 4
bind = $mainMod ALT, 5, movetoworkspace, 5
bind = $mainMod ALT, 6, movetoworkspace, 6
bind = $mainMod ALT, 7, movetoworkspace, 7
bind = $mainMod ALT, 8, movetoworkspace, 8
bind = $mainMod ALT, 9, movetoworkspace, 9

# Mouse Wheel & Keyboard Workspace Navigation (Strictly 1-step relative to active workspace)
# SUPER + Scroll UP = Switch to previous workspace (-1)
bind = $mainMod, mouse_up, workspace, -1
# SUPER + Scroll DOWN = Switch to next workspace (+1)
bind = $mainMod, mouse_down, workspace, +1
bind = $mainMod ALT, mouse_up, movetoworkspace, -1
bind = $mainMod ALT, mouse_down, movetoworkspace, +1

# Keyboard Relative Workspace Switching
bind = $mainMod CTRL, left, workspace, -1
bind = $mainMod CTRL, right, workspace, +1
bind = $mainMod, Page_Up, workspace, -1
bind = $mainMod, Page_Down, workspace, +1
bind = $mainMod SHIFT CTRL, left, movetoworkspace, -1
bind = $mainMod SHIFT CTRL, right, movetoworkspace, +1

# Mouse Drag & Resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Spatial Tabs (Spotify Upper Tab / Extra Lower Shelf - 1-step barrier)
bind = $mainMod, M, exec, ~/.config/monolith/scripts/spatial-tab.sh toggle_spotify
bind = $mainMod, S, exec, ~/.config/monolith/scripts/spatial-tab.sh toggle_extra
bind = $mainMod, grave, exec, ~/.config/monolith/scripts/spatial-tab.sh toggle_extra
bind = $mainMod, Z, exec, monolith-toolbox --toggle
bind = $mainMod ALT, S, exec, ~/.config/monolith/scripts/window-shelf.sh push
bind = $mainMod ALT, X, exec, ~/.config/monolith/scripts/window-shelf.sh pop
bind = $mainMod ALT, Down, exec, ~/.config/monolith/scripts/window-shelf.sh pop

# Fast Utilities
bind = $mainMod, Escape, exec, foot -c ~/.config/monolith/foot/foot.ini --app-id=btop-monitor -e btop
bind = CTRL SHIFT, Escape, exec, foot -c ~/.config/monolith/foot/foot.ini --app-id=btop-monitor -e btop
bind = $mainMod SHIFT, V, exec, ~/.config/monolith/scripts/clipboard.sh
bind = $mainMod, N, exec, ~/.config/monolith/scripts/nightlight.sh
bind = $mainMod, L, exec, hyprlock --config ~/.config/monolith/hyprlock.conf
bind = $mainMod, BackSpace, exec, ~/.config/monolith/scripts/powermenu.sh
bind = $mainMod SHIFT, E, exec, ~/.config/monolith/scripts/powermenu.sh

# Screenshots (SUPER + SHIFT + S / Print / SUPER + Print)
bind = $mainMod SHIFT, S, exec, ~/.config/monolith/scripts/screenshot.sh area
bind = , Print, exec, ~/.config/monolith/scripts/screenshot.sh full
bind = $mainMod, Print, exec, ~/.config/monolith/scripts/screenshot.sh area
bind = $mainMod SHIFT, P, exec, ~/.config/monolith/scripts/screenshot.sh area

# Hardware Keys - Volume (WirePlumber / PipeWire with Micro OSD)
bindel = , XF86AudioRaiseVolume, exec, ~/.config/monolith/scripts/osd.sh vol_up
bindel = , XF86AudioLowerVolume, exec, ~/.config/monolith/scripts/osd.sh vol_down
bindl  = , XF86AudioMute, exec, ~/.config/monolith/scripts/osd.sh vol_mute
bindl  = , XF86AudioMicMute, exec, ~/.config/monolith/scripts/osd.sh mic_mute

# Hardware Keys - Brightness (Micro OSD)
bindel = , XF86MonBrightnessUp, exec, ~/.config/monolith/scripts/osd.sh bright_up
bindel = , XF86MonBrightnessDown, exec, ~/.config/monolith/scripts/osd.sh bright_down

# Multi-Monitor Workspace & Focus Controls
bind = $mainMod, bracketleft, focusmonitor, -1
bind = $mainMod, bracketright, focusmonitor, +1
bind = $mainMod SHIFT, bracketleft, movewindow, mon:-1
bind = $mainMod SHIFT, bracketright, movewindow, mon:+1

# Hardware Keys - Media Controls
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous

# --- Advanced Submap: Window Resize Mode ---
bind = $mainMod, R, submap, resize
submap = resize
binde = , right, resizeactive, 20 0
binde = , left, resizeactive, -20 0
binde = , up, resizeactive, 0 -20
binde = , down, resizeactive, 0 20
binde = , l, resizeactive, 20 0
binde = , h, resizeactive, -20 0
binde = , k, resizeactive, 0 -20
binde = , j, resizeactive, 0 20
bind = , escape, submap, reset
bind = , return, submap, reset
submap = reset

# --- User Settings Override ---
source = ~/.config/monolith/user-settings.conf


# --- Debug & Scale Checks ---
debug {
    disable_scale_checks = true
}
