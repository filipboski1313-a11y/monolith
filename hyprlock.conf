# Monolith Minimalist Hyprlock Configuration (Pure OLED #000000)
general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = true
}

background {
    monitor =
    color = rgb(0, 0, 0)
}

# Clock - Time
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(244, 244, 245)
    font_size = 80
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 120
    halign = center
    valign = center
}

# Clock - Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgb(100, 100, 105)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

# Password Input Field
input-field {
    monitor =
    size = 280, 42
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgb(38, 38, 38)
    inner_color = rgb(0, 0, 0)
    font_color = rgb(244, 244, 245)
    fade_on_empty = false
    placeholder_text = <span foreground="##555555">Password</span>
    hide_input = false
    rounding = 4
    check_color = rgb(161, 161, 170)
    fail_color = rgb(239, 68, 68)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    position = 0, -60
    halign = center
    valign = center
}
