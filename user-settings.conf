# ╔══════════════════════════════════════════════════════════════════╗
# ║             MONOLITH USER SETTINGS (AUTO-GENERATED C++)          ║
# ╚══════════════════════════════════════════════════════════════════╝

# --- Multi-Monitor & Scaling Configuration ---
monitor = eDP-1, preferred, 0x0, 1.23
monitor = , preferred, auto, 1

xwayland {
    force_zero_scaling = true
}

debug {
    disable_scale_checks = true
}

misc {
    vrr = 0
    middle_click_paste = true
}

render {
    direct_scanout = true
}

animations {
    enabled = true
    bezier = customCurve, 1.00, 0.00, 0.00, 0.96
    animation = windowsIn, 1, 1.4, customCurve, popin 90%
    animation = windowsOut, 1, 1.2, customCurve, popin 90%
    animation = windowsMove, 1, 1.4, customCurve
    animation = workspaces, 1, 2.4, customCurve, slide
    animation = specialWorkspace, 1, 2.4, customCurve, slidevert 100%
    animation = fade, 1, 1.2, customCurve
}

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 1
    col.active_border = rgba(ffffffee) rgba(333333aa) 108deg
    col.inactive_border = rgba(14141488)
    allow_tearing = false
}

decoration {
    rounding = 4
    active_opacity = 1.00
    inactive_opacity = 1.00
    fullscreen_opacity = 1.00
    dim_inactive = false
    dim_strength = 0.20
    shadow {
        enabled = true
        range = 20
    }
    blur {
        enabled = false
        size = 7
        passes = 2
    }
}

input {
    sensitivity = 0.00
    accel_profile = adaptive
    repeat_rate = 45
    repeat_delay = 250
    left_handed = false
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        scroll_factor = 1.00
    }
}
