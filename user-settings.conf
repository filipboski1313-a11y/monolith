# ╔══════════════════════════════════════════════════════════════════╗
# ║             MONOLITH USER SETTINGS (AUTO-GENERATED C++)          ║
# ╚══════════════════════════════════════════════════════════════════╝

# --- Monitor & Scaling Configuration ---
monitor = eDP-1, 1920x1200@60.00Hz, auto, 1.28

debug {
    disable_scale_checks = true
}

misc {
    vrr = 0
}

animations {
    enabled = true
    bezier = customCurve, 0.05, 0.90, 0.18, 1.00
    animation = windowsIn, 1, 1.4, customCurve, popin 90%
    animation = windowsOut, 1, 1.2, customCurve, popin 90%
    animation = windowsMove, 1, 1.4, customCurve
    animation = workspaces, 1, 1.4, customCurve, slide
    animation = specialWorkspace, 1, 1.4, customCurve, slidevert 100%
    animation = fade, 1, 1.2, customCurve
}

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 1
    col.active_border = rgba(ffffffee) rgba(333333aa) 45deg
    col.inactive_border = rgba(14141488)
}

decoration {
    rounding = 4
    active_opacity = 1.00
    inactive_opacity = 1.00
    fullscreen_opacity = 1.00
    shadow {
        enabled = true
        range = 20
    }
    blur {
        enabled = false
        size = 7
        passes = 2
    }
}

input {
    sensitivity = 0.00
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        scroll_factor = 1.00
    }
}
