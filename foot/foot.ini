# Monolith Ultra-Minimal Foot Terminal Configuration (Pure OLED #000000)
shell=/bin/fish
font=JetBrainsMono Nerd Font:size=11:antialias=true
dpi-aware=no
pad=16x16
bold-text-in-bright=no
gamma-correct-blending=no

[scrollback]
lines=8000

[cursor]
style=beam
beam-thickness=1.5

[colors-dark]
alpha=1.0
background=000000
foreground=e4e4e7
cursor=000000 f4f4f5

# Regular colors (Monolith Pure OLED Palette)
regular0=000000  # pure black
regular1=ef4444  # red
regular2=22c55e  # green
regular3=eab308  # yellow
regular4=60a5fa  # blue
regular5=a855f7  # magenta
regular6=06b6d4  # cyan
regular7=d4d4d8  # light gray

# Bright colors
bright0=18181b   # surface black
bright1=f87171   # bright red
bright2=4ade80   # bright green
bright3=fde047   # bright yellow
bright4=93c5fd   # bright blue
bright5=c084fc   # bright magenta
bright6=67e8f9   # bright cyan
bright7=ffffff   # pure white

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
